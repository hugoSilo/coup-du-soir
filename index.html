<style>
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --sunk:#E2E7DC; --line:#C9D1C1;
  --fg:#16231C; --muted:#56655B;
  --water:#9CC3C4; --water-deep:#5E9A9E;
  --accent:#4F6B00; --accent-fg:#FFFFFF; --lure:#C6E03A;
  --ok:#2E7D4F; --warn:#C07A00; --ban:#C2362B;
  --ok-bg:#DDF0E3; --warn-bg:#FBEBCB; --ban-bg:#F8DAD6;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#18231D; --sunk:#111A15; --line:#2A3A30;
  --fg:#E6EDE6; --muted:#9BAA9F;
  --water:#1F4A4D; --water-deep:#2F6E72;
  --accent:#C6E03A; --accent-fg:#16231C;
  --ok:#5CC487; --warn:#F0B44C; --ban:#F07266;
  --ok-bg:#183527; --warn-bg:#3A2C10; --ban-bg:#3F1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#18231D; --sunk:#111A15; --line:#2A3A30;
  --fg:#E6EDE6; --muted:#9BAA9F;
  --water:#1F4A4D; --water-deep:#2F6E72;
  --accent:#C6E03A; --accent-fg:#16231C;
  --ok:#5CC487; --warn:#F0B44C; --ban:#F07266;
  --ok-bg:#183527; --warn-bg:#3A2C10; --ban-bg:#3F1A17; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
.me-av{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.me-av .avatar{width:36px;height:36px;font-size:1rem}
.av-edit{position:relative;display:inline-block;cursor:pointer;flex:none}
.av-edit .cam{cursor:pointer;position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid var(--surface)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1000;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:900;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
@font-face{font-family:"Kaushan Script";src:url(vendor/kaushan.woff2) format("woff2");font-display:swap}
.brand .nm{font-family:"Kaushan Script","Brush Script MT",cursive;font-weight:400;font-size:1.65rem;line-height:1.1;letter-spacing:0;padding:2px 4px 4px 0;background:linear-gradient(180deg,#ffe08a 0%,#f7b234 45%,#d9741c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.6px rgba(70,30,0,.55);filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));white-space:nowrap}
.brand .nm small{font-size:.72em}
.brand .logo{width:42px;height:42px;flex:none;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.brand i{width:14px;height:22px;border-radius:7px 7px 9px 9px;background:var(--lure);display:inline-block;transform:rotate(-20deg);box-shadow:inset -3px -4px 0 rgba(0,0,0,.18)}
.net{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.net.off{color:var(--ban)}
h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:20px 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:18px 0 8px}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.86rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:700;border-radius:12px;padding:0 16px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{background:var(--ban);color:#fff;border-color:var(--ban)}
.btn.wide{width:100%} .btn.sm{min-height:40px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lure);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;border:1px solid transparent;background:none;color:inherit;font-family:inherit}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ban{background:var(--ban-bg);color:var(--ban)} .chip.ghost{border-color:var(--line);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
input,select,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:50px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;min-height:44px;border-radius:9px;cursor:pointer;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:950;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:680px}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.7rem;font-weight:700;padding:8px 1px 10px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
#mapwrap{position:relative;margin-top:14px}
#map{height:min(48vh,480px);border-radius:var(--r);border:1px solid var(--line);z-index:1}
#map.adding{outline:3px dashed var(--accent);outline-offset:-3px}
.mapctl{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapctl .btn{min-height:44px;padding:0 12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.leaflet-container{font-family:var(--body);background:var(--sunk)}
.spot-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.score{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.score small{font-size:.8rem;color:var(--muted);font-weight:600}
.stripe{width:6px;align-self:stretch;border-radius:3px}
.sheet{position:fixed;inset:0;z-index:1100;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .bar .t{font-family:var(--display);font-weight:800;font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hours{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:110px;padding-top:8px}
.hours .h{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hours .b{width:100%;border-radius:5px 5px 2px 2px;background:var(--water-deep)}
.hours .b.top{background:var(--accent)}
.hours span{font-family:var(--mono);font-size:.66rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.kv b{display:block;font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv b.t{font-family:var(--body);font-size:.95rem}
.sp{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;grid-column:1/-1}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.lures{display:flex;flex-wrap:wrap;gap:6px}
.lure{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.85rem;background:var(--sunk)}
.catch{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.ph{background:var(--sunk);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem;text-align:center}
.catch .ph{width:96px;height:96px;border-radius:10px}
.catch .meta{min-width:0}
.catch .big{font-family:var(--display);font-weight:800;font-size:1.15rem}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal .ph{width:100%;aspect-ratio:1;border-radius:8px}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
.msg{max-width:84%;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ok-bg);border-color:transparent}
.msg .who{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:900;background:var(--bg);border-top:1px solid var(--line)}
.composer .in{max-width:680px;margin:0 auto;display:flex;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--water-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.3rem;object-fit:cover;flex:none}
.avatar.lg{width:76px;height:76px;font-size:1.8rem}
.gear{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}
.gear .ph{width:56px;height:56px;border-radius:8px}
.alert{border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.alert.ban{background:var(--ban-bg);border-left:5px solid var(--ban)}
.alert.warn{background:var(--warn-bg);border-left:5px solid var(--warn)}
.alert.info{background:var(--sunk);border-left:5px solid var(--water-deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:1300;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:1.1rem;margin-bottom:4px}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.auth{max-width:420px;margin:8vh auto 0}
.wx-best{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wx-bt{font-family:var(--display);font-weight:800;font-size:1.15rem}
.wx-ring{position:relative;flex:none;display:grid;place-items:center}
.wx-ring svg{position:absolute;inset:0;width:100%;height:100%}
.wx-ring b{font-size:1rem;position:relative}
.wx-day{padding:0;overflow:hidden}
.wx-head{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.wx-mid{flex:1;min-width:0}
.wx-dn{font-weight:700;display:flex;align-items:center;gap:6px}
.wx-ic{font-size:1.15rem;line-height:1}
.wx-rel{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;width:62px}
.wx-relbar{display:block;width:100%;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.wx-relbar i{display:block;height:100%;background:var(--water-deep)}
.wx-body{padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.wx-chart{width:100%;height:96px;display:block;color:var(--fg)}
select{font:inherit}
#aq-wrap{display:flex;gap:10px;position:relative}
#aq-3d{position:relative;flex:1;min-width:0;height:min(64vh,540px);border-radius:var(--r);overflow:hidden;background:#0b1a22;color:#fff}
#aq-3d canvas{display:block;width:100%;height:100%;outline:none}
#aq-list{width:230px;flex:none;height:min(64vh,540px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#aq-wrap.nolist #aq-list{display:none}
.aq-lh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.aq-lh select{width:auto;min-height:36px;padding:4px 8px;font-size:.85rem}
.aq-items{overflow:auto;flex:1;overscroll-behavior:contain}
.aq-items button{appearance:none;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;cursor:pointer}
.aq-items button>span{display:flex;flex-direction:column;min-width:0}
.aq-items button[aria-current="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.aq-th{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk);font-size:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
.aq-tools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;pointer-events:none}
.aq-tools .btn{pointer-events:auto;background:rgba(10,20,26,.62);color:#fff;border-color:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-height:38px;padding:0 10px}
.aq-tools .btn[aria-pressed="true"]{background:rgba(242,163,58,.9);color:#1b0e06;border-color:transparent}
.aq-tools .aq-lt{margin-left:auto}
.aq-help{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:rgba(255,255,255,.7);pointer-events:none;text-shadow:0 1px 3px #000;font-size:.75rem;padding:0 8px}
.aq-msg{position:absolute;inset:auto 16px 40%;text-align:center;color:#fff;text-shadow:0 1px 4px #000;font-weight:700;pointer-events:none}
#aq-cardwrap{position:absolute;left:8px;right:8px;bottom:28px;z-index:4;pointer-events:none}
.aq-card{pointer-events:auto;display:flex;gap:10px;background:rgba(10,20,26,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;color:#fff;max-width:420px}
.aq-card .muted{color:#c9d6d9!important}
.aq-card .btn{min-height:34px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
.aq-cph{width:76px;height:76px;border-radius:8px;object-fit:cover;flex:none;background:#22343c;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.aq-cb{min-width:0;flex:1}
#aq-joy{position:absolute;left:12px;bottom:30px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;z-index:3;pointer-events:none}
.joy{pointer-events:auto;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;touch-action:none}
.joy i{width:46px;height:46px;border-radius:50%;background:rgba(242,163,58,.9);display:block;transition:transform .05s}
.joy-ud{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.joy-ud .btn{background:rgba(10,20,26,.62);color:#fff;border-color:rgba(255,255,255,.2);width:50px;min-height:50px;touch-action:none}
#aq-wrap.full{position:fixed;inset:0;z-index:2000;background:#000;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);gap:0}
#aq-wrap.full #aq-3d,#aq-wrap.full #aq-list{height:100%;border-radius:0}
body.aq-full{overflow:hidden}
@media (max-width:599px){
 #aq-list{position:absolute;top:52px;right:8px;bottom:8px;height:auto;width:min(78%,280px);z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.4)}
 #aq-wrap:not(.showlist) #aq-list{display:none}
 #aq-wrap.full #aq-list{height:auto;border-radius:var(--r)}
}
.aq-podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.aq-podium .pd{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:0}
.aq-podium .pd-ph{width:68px;height:68px;border-radius:50%;overflow:hidden;border:3px solid #caa64a;margin-bottom:4px;background:var(--sunk)}
.aq-podium .pd1 .pd-ph{width:84px;height:84px;border-color:#e8c24a}
.aq-podium .pd2 .pd-ph{border-color:#b8c0c8}.aq-podium .pd3 .pd-ph{border-color:#c0804a}
.pd-img{width:100%;height:100%;object-fit:cover;font-size:9px;display:flex;align-items:center;justify-content:center}
.pd-step{width:100%;margin-top:6px;border-radius:10px 10px 0 0;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(180deg,var(--surface),var(--sunk));border:1px solid var(--line);border-bottom:0}
.pd1 .pd-step{height:96px;background:linear-gradient(180deg,#f3d36a,#c99a2a)}.pd2 .pd-step{height:70px;background:linear-gradient(180deg,#dfe4ea,#9aa4ae)}.pd3 .pd-step{height:52px;background:linear-gradient(180deg,#e2a46a,#a8642e)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* En-tête : bandeau coucher de soleil */
header.top{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,rgba(8,5,10,.78) 0%,rgba(8,5,10,.35) 55%,rgba(8,5,10,.7) 100%),url(fond-bandeau.jpg?v=1) center 50%/cover #1a0f14;border-bottom:1px solid rgba(255,170,80,.4);color:#fff;color-scheme:dark}
header.top .net{color:#fff}
body::before{background:#120a10!important}
/* Connexion : fond plein écran */
body.auth-mode{background:#0b0709}
body.auth-mode .wrap{padding-bottom:0}
body.auth-mode .wrap::before{content:"";position:fixed;inset:0;z-index:-1;background:url(fond-connexion.jpg?v=1) center top/cover no-repeat #0b0709}
body.auth-mode header.top{display:none}
body.auth-mode .auth{margin:0 auto;min-height:100svh;justify-content:flex-end;padding:0 0 calc(20px + env(safe-area-inset-bottom,0px));color-scheme:dark;
  --fg:#FFF4E6;--muted:#E9D3BC;--surface:rgba(16,10,14,.66);--sunk:rgba(0,0,0,.42);--line:rgba(255,180,100,.32);--accent:#F2A33A;--accent-fg:#1B0E06;color:var(--fg)}
body.auth-mode .auth .panel{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.auth-mode .auth .seg{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.auth-mode .auth input{background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,180,100,.35)}
body.auth-mode .auth .tag{text-shadow:0 1px 6px rgba(0,0,0,.9);color:#FFE9CF}

.auth .brand{font-size:2.2rem;justify-content:center;margin-bottom:6px}
table.reg{border-collapse:collapse;width:100%;min-width:420px}
table.reg th,table.reg td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#zonemap{position:relative;z-index:0}
nav.tabs .nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ban);color:#fff;font:700 11px/18px var(--body);text-align:center}
.zoomable{cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:2000;background:rgba(8,12,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));cursor:zoom-out;animation:zin .18s ease-out}
#zoom img{max-width:min(92vw,560px);max-height:72vh;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5);object-fit:contain}
#zoom img.round{border-radius:50%}
#zoom .zt{color:#EEF1EA;font-family:var(--display);font-weight:800;font-size:1.3rem}
#zoom .zc{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
@keyframes zin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.zone-tip{font-family:var(--body);font-size:11px;font-weight:700;padding:2px 6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <button data-tab="aquarium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/><path d="M3 9.5c3 1 6-1 9 0s6 1 9 0"/><path d="M8 15c1.6-1.6 3.6-1.6 5 0-1.4 1.6-3.4 1.6-5 0Zm5 0 2-1.3v2.6Z"/></svg>Aquarium</button>
    <button data-tab="profils"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profils</button>
  </div>
